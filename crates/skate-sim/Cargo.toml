[package]
name = "skate-sim"
description = "Bevy-free extraction of skate-game's simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Plain multiply + add instead of f32::mul_add (skate-core/src/madd.rs).
no-fma = ["skate-core/no-fma", "skate-audio/no-fma"]
soft-fma = ["skate-core/soft-fma"]
madd-audit = ["skate-core/madd-audit"]
fma-f64 = ["skate-core/fma-f64"]
# Parity oracle harness (tools/sim-oracle/harness).
oracle = []
stage-profile = ["skate-core/stage-profile"]
madd-count = ["skate-core/madd-count"]

[dependencies]
# The audio-state record the skater publishes each tick (`audio_events`).
skate-audio = { path = "../skate-audio" }
skate-core = { path = "../skate-core" }
skate-data = { path = "../skate-data" }
skate-trainer-stub = { path = "../skate-trainer-stub" }
# bevy::math re-exports glam; this is the exact version and arithmetic of bevy_math 0.18.1.
glam = { version = "=0.30.10", default-features = false, features = ["std"] }
# bevy::log re-exports the tracing macros (structured fields, spans), so tracing replaces it
# as is. Without a subscriber, disabled logs and spans cost one check. Level limits
# (e.g. release_max_level_warn so nothing logs per tick) are set by the binaries.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
serde.workspace = true
parry3d = "=0.30.2"
serde_json.workspace = true
