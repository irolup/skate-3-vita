[package]
name = "skate-ui"
description = "The original Skate 3 APT HUD runtime, extracted from skate-game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, features = ["rc"] }
# R2: the front end's menu registry, crossbar, screen stack and pad input; the menu tables.
skate-core = { path = "../skate-core" }
skate-data = { path = "../skate-data" }
serde_json.workspace = true

[features]
# skate_vita (R2 performance): the front end's phase timers (`fe::profile`).
fe-profile = []
